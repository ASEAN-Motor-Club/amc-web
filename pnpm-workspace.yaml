packages:
  # Direct children only — the .NET build output (wasm/pakop/bin) contains a
  # copied package.json that a deep glob would pick up as a workspace package.
  - wasm/*

allowBuilds:
  '@bufbuild/buf': true
  esbuild: true
  lefthook: true
dedupePeers: true
minimumReleaseAge: 4320
savePrefix: ''
engineStrict: true
