name: 🟣 Build WASM
permissions:
  contents: read
on:
  - workflow_call

jobs:
  wasm:
    name: 🟣 Build WASM
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🟣 Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: 🗂️ Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('wasm/pakop/Pakop.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 📦 Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: 🎨 Check formatting
        run: dotnet format wasm/pakop --verify-no-changes

      - name: 🔨 Build WASM (pakop)
        run: dotnet build wasm/pakop/Pakop.csproj -c Release

      - name: 📤 Upload pakop artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg
          path: wasm/pakop/bin/Release/net10.0/wwwroot
