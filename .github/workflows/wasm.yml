name: 🟣 Build WASM
permissions:
  contents: read
on:
  workflow_call:
    inputs:
      build:
        description: 'Build the WASM package and upload it as an artifact'
        type: boolean
        default: true

jobs:
  wasm:
    name: 🟣 Build WASM
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🟣 Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 🗂️ Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('wasm/pakop/Pakop.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 📦 Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: 🎨 Check formatting
        run: dotnet format wasm/pakop --verify-no-changes

      - name: 🔨 Build WASM (pakop)
        if: inputs.build
        run: dotnet build wasm/pakop/Pakop.csproj -c Release

      - name: 📤 Upload pakop artifact
        if: inputs.build
        uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg
          path: wasm/pakop/bin/Release/net10.0/wwwroot
