pre-commit:
  piped: true
  jobs:
    - name: wasm
      glob: 'wasm/*'
      group:
        jobs:
          - name: dotnet format
            run: dotnet format wasm/pakop --verify-no-changes
          - name: build-pakop
            run: pnpm build:pakop

    - name: pre-frontend
      glob: 'src/*'
      group:
        parallel: true
        jobs:
          - name: paraglide compile
            run: pnpm paraglide:compile
          - name: proto generate
            run: pnpm proto:generate

    - name: frontend
      glob: 'src/*'
      group:
        parallel: true
        jobs:
          - name: pnpm lint
            run: pnpm lint
          - name: pnpm check
            run: pnpm check
          - name: pnpm test
            run: pnpm test
